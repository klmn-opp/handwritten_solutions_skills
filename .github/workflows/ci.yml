name: Runtime and Studio
on:
  push:
    branches: [main, candidate/personal-first]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python -m pip install uv==0.13.7
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync python -m pytest -ra
      - run: uv run --no-sync python scripts/package_release.py --stage .release-work/public-source
      - run: uv build --out-dir ../../dist
        working-directory: .release-work/public-source
      - run: uv run --no-sync python scripts/smoke_wheel.py --dist dist
