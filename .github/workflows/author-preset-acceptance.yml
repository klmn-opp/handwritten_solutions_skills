name: Author preset native acceptance
on:
  workflow_dispatch:
  push:
    branches: [candidate/personal-first]
permissions:
  contents: read
jobs:
  native:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python -m pip install uv==0.13.7
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked
      - name: Render actual compiled author ink on this native platform
        run: uv run --no-sync python scripts/check_author_preset.py --output preset-evidence
      - name: Preserve actual evidence in a separate branch
        env:
          EVIDENCE_BRANCH: evidence/author-${{ github.sha }}-${{ runner.os }}-${{ matrix.python }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- preset-evidence
          git commit -m 'test: preserve native author preset evidence'
          git push origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
